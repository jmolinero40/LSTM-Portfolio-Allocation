# The configuration behind every number in README.md.
#
# Architecture, training and portfolio parameters are the thesis ones
# (Appendix G of the thesis, and the values its backtest scripts actually used
# where the two disagree; see docs/METHOD.md). What changes is the protocol:
# annual walk-forward re-training, fit-window preprocessing, raw-return PnL,
# transaction costs and three seeds.

name: walkforward

data:
  snapshot: data/snapshot/prices_adjclose.csv
  sha256: b0f19806b2f4ffe0efc5a8140dc5ea4a2985d11af3aab6dc9edb62708778f333
  start: "2013-01-01"
  end: "2025-12-31"      # inclusive and fixed: never "until today"

features:
  winsor_lower: 0.005    # quantiles estimated on each fold's fit window only
  winsor_upper: 0.995
  ema_span: 20           # baseline: the return net predicts r_t - EMA_{t-1}

walkforward:
  test_years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  val_fraction: 0.15     # last 15% of the pre-test sample: early stopping only
  seeds: [0, 1, 2]

return_model:
  lookback: 60
  units: [64, 32]
  dropout: 0.2
  l2: 1.0e-5
  learning_rate: 1.0e-3
  batch_size: 32
  epochs: 200
  early_stopping_patience: 15
  reduce_lr_patience: 7
  reduce_lr_factor: 0.5
  min_lr: 1.0e-5
  shuffle: false
  huber_delta: 1.0

risk_model:
  lookback: 240
  units: [64, 32]
  dropout: 0.2
  l2: 1.0e-5
  learning_rate: 1.0e-3
  batch_size: 32
  epochs: 200
  early_stopping_patience: 15
  reduce_lr_patience: 7
  reduce_lr_factor: 0.5
  min_lr: 1.0e-5
  shuffle: false
  init_output_bias: true # see docs/METHOD.md §2: the one change to training

portfolio:
  k: 5                   # the thesis backtests used 5 (the text says 4)
  tau: 6.0
  w_max: 0.3
  target_annual_vol: 0.15
  corr_window: 60        # the thesis backtest used the 60-day input window
  corr_lambda: 0.97
  corr_shrinkage: 0.3
  ewma_sigma_lambda: 0.97

evaluation:
  cost_bps: [0.0, 5.0, 10.0]
  var_alpha: 0.01
  bootstrap_block: 20
  bootstrap_samples: 5000
  bootstrap_seed: 0

output:
  runs_dir: runs/walkforward
  results_dir: results/walkforward
